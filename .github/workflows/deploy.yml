name: Deploy UWC Logistics App

on:
    push:
        branches: [main]

# env:
#   NEXT_PUBLIC_API_URL:
#    {{ secrets.NEXT_PUBLIC_API_URL }}
#     VITE_COGNITO_USERPOOL_ID: ${{ secrets.VITE_COGNITO_USERPOOL_ID }}
#   VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
#   NEXT_PUBLIC_REGION: ${{ secrets.VITE_AWS_REGION}}

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v3

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "24"

            - name: Install Dependencies
              run: npm install

            - name: Build
              env:
                  VITE_API_URL: ${{ secrets.VITE_API_URL }}
                  VITE_COGNITO_USERPOOL_ID: ${{ secrets.VITE_COGNITO_USERPOOL_ID }}
                  VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
                  VITE_AWS_REGION: ${{ secrets.VITE_AWS_REGION }}
              run: npm run build

            - name: List build output
              run: ls -la dist/

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.VITE_AWS_ACCESS_KEY_ID }}
                  aws-secret-access-key: ${{ secrets.VITE_AWS_SECRET_ACCESS_KEY }}
                  aws-region: af-south-1
                  # Add permissions for Cognito operations
                  role-duration-seconds: 3600
                  role-session-name: GithubActionsCognito

            # Add Cognito configuration validation
            # - name: Validate Cognito Configuration
            #   run: |
            #       aws cognito-idp describe-user-pool \
            #         --user-pool-id ${{ secrets.VITE_CLOUDFRONT_DISTRIBUTION_ID }} \
            #         --query 'UserPool.Id' \
            #         --output text

            - name: Deploy to S3
              run: |
                  # HTML files
                  aws s3 sync dist/ s3://${{ secrets.VITE_AWS_BUCKET_NAME }} \
                    --exclude "*" \
                    --include "*.html" \
                    --metadata-directive REPLACE \
                    --cache-control max-age=0,no-cache,no-store,must-revalidate \
                    --content-type text/html

                  # CSS files
                  aws s3 sync dist/ s3://${{ secrets.VITE_AWS_BUCKET_NAME }} \
                    --exclude "*" \
                    --include "*.css" \
                    --metadata-directive REPLACE \
                    --cache-control max-age=31536000 \
                    --content-type text/css

                  # JavaScript files
                  aws s3 sync dist/ s3://${{ secrets.VITE_AWS_BUCKET_NAME }} \
                    --exclude "*" \
                    --include "*.js" \
                    --metadata-directive REPLACE \
                    --cache-control max-age=31536000 \
                    --content-type application/javascript

                  # Images
                  aws s3 sync dist/ s3://${{ secrets.VITE_AWS_BUCKET_NAME }} \
                    --exclude "*" \
                    --include "*.jpg" \
                    --include "*.jpeg" \
                    --include "*.png" \
                    --include "*.gif" \
                    --include "*.ico" \
                    --metadata-directive REPLACE \
                    --cache-control max-age=31536000

                  # Other static assets
                  aws s3 sync dist/ s3://${{ secrets.VITE_AWS_BUCKET_NAME }} \
                    --exclude "*.html" \
                    --exclude "*.css" \
                    --exclude "*.js" \
                    --exclude "*.jpg" \
                    --exclude "*.jpeg" \
                    --exclude "*.png" \
                    --exclude "*.gif" \
                    --exclude "*.ico" \
                    --delete

            - name: Invalidate CloudFront
              run: |
                  aws cloudfront create-invalidation \
                    --distribution-id ${{ secrets.VITE_CLOUDFRONT_DISTRIBUTION_ID }} \
                    --paths "/*"

            - name: Verify S3 upload
              run: aws s3 ls s3://${{ secrets.VITE_AWS_BUCKET_NAME }}
